<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Restablecer Contraseña - MercadoClick</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-icon">
                ✦
            </div>

            <h1>Crea una nueva contraseña</h1>

            <p class="auth-description">
                Escribe tu nueva contraseña para tu cuenta de MercadoClick.
            </p>

            <form id="restablecerForm">

                <div class="form-group">
                    <label for="password">Nueva contraseña</label>

                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres"
                            minlength="6" required>

                        <button type="button" class="show-password" id="showPassword">
                            👁
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>

                    <div class="password-container">
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Repite la contraseña" minlength="6" required>

                        <button type="button" class="show-password" id="showConfirmPassword">
                            👁
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth-button">
                    Guardar contraseña
                </button>

            </form>

            <p class="auth-switch">
                <a href="login.html">Volver a iniciar sesión</a>
            </p>

        </section>


        <section class="auth-brand">

            <img src="../assets/images/logo.png" alt="MercadoClick" class="auth-logo">

            <h2>Compra fácil.<br>Compra seguro.</h2>

            <p>
                Todo lo que necesitas, en un solo lugar.
            </p>

        </section>

    </main>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
