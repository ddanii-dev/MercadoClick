<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - MercadoClick</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-brand">

            <img src="../assets/images/logo.png" alt="MercadoClick" class="auth-logo">

            <h2>Compra fácil.<br>Compra seguro.</h2>

            <p>
                Todo lo que necesitas, en un solo lugar.
            </p>

        </section>


        <section class="auth-card">

            <div class="auth-icon">
                ✦
            </div>

            <h1>Crear una cuenta</h1>

            <p class="auth-description">
                Regístrate para comenzar a comprar en MercadoClick
            </p>

            <form id="registerForm">

                <div class="form-group">
                    <label for="nombre">Nombre</label>

                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="cedula">Cédula</label>

                    <input type="text" id="cedula" name="cedula" placeholder="Ingresa tu cédula" required>
                </div>

                <div class="form-group">
                    <label for="correo">Email</label>

                    <input type="email" id="correo" name="correo" placeholder="Ingresa tu email" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>

                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>

                        <button type="button" class="show-password" id="showPassword">
                            👁
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Repetir contraseña</label>

                    <div class="password-container">
                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Repite tu contraseña" required>

                        <button type="button" class="show-password" id="showConfirmPassword">
                            👁
                        </button>
                    </div>
                </div>

                <button type="submit" class="auth-button">
                    Registrarse
                </button>

            </form>

            <p class="auth-switch">
                ¿Ya tienes una cuenta?
                <a href="login.html">Inicia sesión</a>
            </p>

        </section>

    </main>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
