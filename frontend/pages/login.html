<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión - MercadoClick</title>

    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-icon">
                ✦
            </div>

            <h1>¡Bienvenido de nuevo!</h1>

            <p class="auth-description">
                Inicia sesión para continuar en MercadoClick
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="correo">Correo</label>
                    <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>

                    <div class="password-container">
                        <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña"
                            required>

                        <button type="button" class="show-password" id="showPassword">
                            👁
                        </button>
                    </div>
                </div>

                <div class="login-options">

                    <label class="remember">
                        <input type="checkbox" id="remember">
                        <span>Recordar por 30 días</span>
                    </label>

                    <a href="recuperar.html" class="forgot-password">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>

                <button type="submit" class="auth-button">
                    Iniciar Sesión
                </button>

            </form>

            <p class="auth-switch">
                ¿No tienes una cuenta?
                <a href="registro.html">Regístrate</a>
            </p>

        </section>


        <section class="auth-brand">

            <img src="../assets/images/logo.png" alt="MercadoClick" class="auth-logo">

            <h2>Compra fácil.<br>Compra seguro.</h2>

            <p>
                Todo lo que necesitas, en un solo lugar.
            </p>

        </section>

    </main>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>

</body>

</html>
